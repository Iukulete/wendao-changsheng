name: Ark Windows Validation and Export

on:
  push:
    branches:
      - main
      - codex/island-survival-slice
      - codex/dot-ark-stability-audit
  pull_request:
    branches:
      - main
      - codex/island-survival-slice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    name: Validate 3D Ark and export Godot 4.7.1
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active source and preserved archive boundaries
        shell: pwsh
        run: |
          python -X utf8 ./tools/verify_migration_surface.py
          if ($LASTEXITCODE -ne 0) { throw "Active Ark boundary failed." }
          python -X utf8 ./tools/verify_source_archive.py
          if ($LASTEXITCODE -ne 0) { throw "Reusable source archive validation failed." }

      - name: Cache verified Godot archives and templates
        uses: actions/cache@v4
        with:
          path: |
            tools/godot/4.7.1/Godot_v4.7.1-stable_win64.exe.zip
            tools/godot/4.7.1/Godot_v4.7.1-stable_export_templates.tpz
          key: godot-4.7.1-windows-c7a28905-templates-86409db6

      - name: Prepare pinned official Godot environment
        shell: pwsh
        run: ./tools/prepare_godot.ps1

      - name: Headless import, Ark menu, all Ark regressions and packed scene smoke
        shell: pwsh
        run: ./tools/verify_godot.ps1 -NoPrepare

      - name: Separate display-backed Ark menu and gameplay captures
        shell: pwsh
        run: ./tools/verify_render.ps1

      - name: Export and smoke-test actual Windows executable
        shell: pwsh
        run: ./tools/build_godot.ps1 -NoPrepare -SkipVerify

      - name: Verify font licenses, checksums and Ark-only resource pack
        shell: pwsh
        run: ./tools/verify_release_bundle.ps1

      - name: Upload verified Ark Windows build
        uses: actions/upload-artifact@v4
        with:
          name: wendao-ark-4.7.1-windows-x86_64
          path: release/godot/windows/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve validation logs and Ark captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-validation-evidence
          path: |
            .tmp/godot-verify/logs/
            .tmp/godot-build/*.log
            .tmp/ark-render-captures/*.png
          if-no-files-found: warn
          retention-days: 14
