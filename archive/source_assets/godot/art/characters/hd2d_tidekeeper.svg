    <rect x="16" y="68" width="20" height="20" fill="#647d82"/><rect x="60" y="68" width="20" height="20" fill="#647d82"/>
    <rect x="36" y="60" width="12" height="24" fill="#e0d2b7"/><rect x="48" y="60" width="12" height="24" fill="#384852"/>
    <rect x="24" y="84" width="48" height="8" fill="#c69a59"/><rect x="44" y="84" width="8" height="8" fill="#e6cf9c"/>
    <!-- Coat tails, cuffs and boots -->
    <rect x="24" y="92" width="48" height="20" fill="#536771"/><rect x="20" y="104" width="56" height="8" fill="#647d82"/>
    <rect x="12" y="84" width="20" height="8" fill="#e0d2b7"/><rect x="64" y="84" width="20" height="8" fill="#e0d2b7"/>
